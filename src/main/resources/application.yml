spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shareit
    username: shareit
    password: shareit
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  logging:
    level:
      org:
        springframework:
          orm.jpa: INFO
          transaction: INFO
          transaction.interceptor: TRACE
          orm.jpa.JpaTransactionManager: DEBUG
      #hibernate: DEBUG
      #jdbc: DEBUG

  config:
    activate:
      on-profile: ci,test